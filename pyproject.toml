[project]
name = "gollum"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.43.2",
    "litellm>=1.95.0",
    "openai>=2.52.0",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "anthropic>=0.120.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]
duckdb = [
    "duckdb>=1.5.5",
    "pyarrow>=25.0.0",
]


[tool.pytest.ini_options]
markers = [
    "duckdb: tests against DuckDBPermacache -- slower (real on-disk DuckDB connections); skipped by default, run with `-m duckdb` or `-m ''`.",
]
addopts = "-m 'not duckdb'"

[tool.coverage.report]
exclude_also = [
"@(abc\\.)?abstractmethod",
]

[tool.coverage.run]
omit = ["tests/*"]